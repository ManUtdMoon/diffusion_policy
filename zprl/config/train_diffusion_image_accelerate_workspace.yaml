defaults:
  - train_flow_match_unet_image_workspace
  - _self_

name: train_diffusion_image_accelerate
_target_: zprl.workspace.train_diffusion_image_accelerate_workspace.TrainDiffusionImageAccelerateWorkspace

dataloader:
  num_workers: 6

val_dataloader:
  num_workers: 2

training:
  mixed_precision: "no"
  ddp_find_unused_parameters: True

checkpoint:
  cov_rel:
    decode_batch_size: 32 # observations per decode
    num_candidate: 64 # candidate action chunks per observation
