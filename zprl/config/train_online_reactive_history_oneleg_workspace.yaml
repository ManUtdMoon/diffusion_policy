defaults:
  - online_task: oneleg_image
  - _self_

name: train_online_reactive_history_oneleg_workspace
_target_: zprl.workspace.train_online_reactive_history_oneleg_workspace.TrainOnlineReactiveHistoryOneLegWorkspace

task_name: ${online_task.name}
shape_meta: ${online_task.shape_meta}
exp_name: default

horizon: 16
n_obs_steps: 1
n_action_steps: 8
n_rl_steps: 8
single_gamma: 0.997
num_inference_steps: 5

res_policy:
  _target_: zprl.policy.reactive_history_policy.HistoryResiduePolicy
  obs_dim: ???
  action_dim: ???
  actor_input: obs_action
  hidden_dim: 512
  log_std_min: -10.0
  log_std_max: 2.0
  gamma: ${eval:"round(${single_gamma}**${n_rl_steps}, 4)"}
  tau: 0.005
  init_alpha: 0.001
  auto_alpha: true
  res_scale: ${training.res_scale}
  num_qs: 10
  num_subset: 2
  q_ent: false
  history_length: 1
  sub_ratio: 1
  gru_input_dim: 128
  gru_hidden_dim: 128
  gru_num_layers: 1
  critic_action_input: base_res
  target_clip: [0, 1]
  debug: ${training.debug}

training:
  device: cuda:0
  seed: 42
  debug: false
  batch_size: 256
  policy_lr: 1e-4
  q_lr: 1e-4
  enc_lr: 1e-5
  learning_start: 5000
  max_grad_norm: 50.0
  policy_freq: 2
  target_freq: 1
  training_freq: 200
  utd: 4.0
  n_envs: ${online_task.n_envs}
  res_scale: 0.05 # Existing algorithm default; formal experiment scale remains to be tuned.
  reward_offset: 0.0
  bootstrap_at_done: truncated
  n_step: 1
  compile: false
  num_steps: 125000
  buffer_size: 125000
  log_every: 1000
  tqdm_interval_sec: 1.0

logging:
  project: oneleg_online
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
