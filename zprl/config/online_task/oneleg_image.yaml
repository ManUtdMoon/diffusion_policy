name: oneleg_image

shape_meta:
  obs:
    color_image1:
      shape: [3, 240, 320]
      type: rgb
    color_image2:
      shape: [3, 240, 320]
      type: rgb
    robot_state:
      shape: [16]
      type: low_dim
  action:
    shape: [10]

base_ckpt: data/upload/oneleg/checkpoints/epoch_0055-mse_0.020349.ckpt
