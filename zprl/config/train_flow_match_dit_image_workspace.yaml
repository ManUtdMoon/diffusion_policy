defaults:
  - _self_
  - task: square_image_abs

name: train_flow_match_dit_image
_target_: zprl.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 1
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
n_prev_action_steps: 4
past_action_visible: False

policy:
  _target_: zprl.policy.flow_match_dit_image_policy.FlowMatchDitImagePolicy

  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: zprl.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: zprl.model.vision.model_getter.ResNet18Pooling
      input_shape: [3, 76, 76] # should match crop_shape
      weights: null
      # pooling_kwargs
      pooling_type: "spatial_learned_embeddings"
      num_spatial_blocks: 8
      bottleneck_dim: 256
    resize_shape: null
    crop_shape: [76, 76]
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  n_prev_action_steps: ${n_prev_action_steps}
  num_inference_steps: 5
  num_blocks: 6
  hidden_dim: 384
  time_dim: 128
  dropout: 0.0
  dim_feedforward: 2048
  nhead: 8
  activation: gelu

ema:
  _target_: zprl.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.8
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 12
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 0
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine_with_min_lr
  lr_warmup_steps: 100
  lr_scheduler_kwargs:
    min_lr_ratio: 0.0
  num_epochs: 1001
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  # training loop control
  # in epochs
  rollout_every: 100
  checkpoint_every: 100
  val_every: 25
  sample_every: 25
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: offline_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 2
    format_str: 'epoch_{epoch:04d}-score_{test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
