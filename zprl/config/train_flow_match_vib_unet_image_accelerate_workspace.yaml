defaults:
  - _self_
  - task: can_image_abs

name: train_flow_match_vib_unet_image_accelerate
_target_: zprl.workspace.train_flow_match_vib_unet_image_accelerate_workspace.TrainFlowMatchVibUnetImageAccelerateWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 1
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: zprl.policy.flow_match_vib_unet_image_policy.FlowMatchVibUnetImagePolicy
  vib_latent_dim: 16
  vib_alpha: 1.0
  vib_beta: 2.0e-4
  vib_recon: 0.01
  vib_hidden_dim: 256

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_flow_match_euler_discrete.FlowMatchEulerDiscreteScheduler
    num_train_timesteps: 100

  obs_encoder:
    _target_: zprl.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: zprl.model.vision.model_getter.TimmPooling
      model_name: "convnextv2_pico"
      input_shape: [3, 160, 160]
      pooling_type: "spatial_learned_embeddings"
      num_spatial_blocks: 8
      bottleneck_dim: 256
    resize_shape: [177, 177]
    crop_shape: [160, 160]
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 5
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [128,256,512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: zprl.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.8
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256  # total batch size across all GPUs
  num_workers: 6
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64  # total batch size across all GPUs
  num_workers: 2
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  mixed_precision: "no"
  ddp_find_unused_parameters: True
  lr_scheduler: cosine_with_min_lr
  lr_warmup_steps: 100
  lr_scheduler_kwargs:
    min_lr_ratio: 0.0
  num_epochs: 1001
  use_ema: True
  rollout_every: 100
  checkpoint_every: 100
  val_every: 25
  sample_every: 25
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: offline_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 2
    format_str: 'epoch_{epoch:04d}-score_{test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
