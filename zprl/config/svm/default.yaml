_target_: zprl.model.svm.svm_reward.SVMRewardModel

# process reward
enable: false
reward_scale: 0.05  # lambda: process reward weight
reward_clip: 20.0  # beta: clip range for discriminator logits

# discriminator architecture
hidden_dim: 256
num_layers: 2  # number of hidden layers

# discriminator training
batch_size: 64
learning_rate: 1e-4
gradient_steps: 32  # optimizer steps per update
warmup_gradient_steps: 256  # optimizer steps after warmup before policy updates
update_every: 1000  # environment steps between updates
min_samples_per_class: 64  # required labeled transitions per class
