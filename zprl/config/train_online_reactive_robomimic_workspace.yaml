defaults:
  - train_online_robomimic_workspace
  - _self_

name: train_online_reactive_robomimic_workspace
_target_: zprl.workspace.train_online_reactive_robomimic_workspace.TrainOnlineReactiveRobomimicWorkspace

# Base plans span n_action_steps; residuals and replay transitions span n_rl_steps.
n_rl_steps: 2

online_task:
  env_runner:
    n_action_steps: ${n_rl_steps}

res_policy:
  _target_: zprl.policy.reactive_policy.ResiduePolicy
  gamma: ${eval:"round(${single_gamma}**${n_rl_steps}, 4)"}

training:
  n_step: 4
  learning_start: 4000
  training_freq: 200
