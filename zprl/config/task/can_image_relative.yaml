name: can_image

shape_meta: &shape_meta
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
    robot0_eef_rot6d:
      shape: [6]
    robot0_gripper_qpos:
      shape: [2]
  action:
    shape: [10]

task_name: &task_name can
dataset_type: &dataset_type mh
dataset_path: &dataset_path /media/datahub-2/ydj/robomimicv030/${task.task_name}/${task.dataset_type}/image_v141_subset_abs.hdf5

env_runner:
  _target_: zprl.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: *dataset_path
  shape_meta: *shape_meta
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 200'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: False
  action_pose_repr: relative
  tqdm_interval_sec: 1.0
  n_envs: 28

dataset:
  _target_: zprl.dataset.robomimic_replay_image_relative_dataset.RobomimicReplayImageRelativeDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.02
  num_demo: 100
