name: adroit_pen

task_name: pen
crop_shape: [80, 80]

shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    agent_pos:
      shape: [24]
      type: low_dim
  action:
    shape: [24]

env_runner:
  _target_: zprl.env_runner.adroit_runner.AdroitRunner
  eval_episodes: 100
  max_steps: 150
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  task_name: ${task.task_name}
  tqdm_interval_sec: 1.0
  n_envs: 25
  test_start_seed: 10000
  render_device_id: ${eval:'int("${training.device}".split(":")[-1])'}

dataset:
  _target_: zprl.dataset.adroit_image_dataset.AdroitImageDataset
  zarr_path: ./data_local/adroit/adroit_pen_expert.zarr
  n_obs_steps: ${n_obs_steps}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  task_name: ${task.task_name}
