defaults:
  - _self_
  - online_task: metaworld_peg-insert-side

name: train_online_workspace
_target_: diffusion_policy.workspace.train_online_workspace.TrainOnlineWorkspace

task_name: ${online_task.name}
shape_meta: ${online_task.shape_meta}
exp_name: "default"

horizon: 8
n_obs_steps: 1
n_action_steps: 4
n_latency_steps: 0

res_policy:
  _target_: diffusion_policy.policy.residue_policy.ResiduePolicy
  obs_dim: ???
  action_dim: ???
  actor_input: obs_action
  hidden_dim: 256
  log_std_min: -10.0
  log_std_max: 2.0
  gamma: ${eval:"round(0.99**${n_action_steps}, 2)"}
  tau: 0.005
  init_alpha: 0.1
  auto_alpha: True
  res_scale: ${training.res_scale}
  num_qs: 2
  num_subset: 2

training:
  device: "cuda:0"
  seed: 42
  debug: False
  # optimization
  batch_size: 256
  policy_lr: 1e-4
  q_lr: 3e-4
  learning_start: 4000
  # lr_scheduler: cosine
  # lr_warmup_steps: 100
  max_grad_norm: 1.0
  policy_freq: 2
  target_freq: 2
  training_freq: 1000
  utd: 1.0
  n_envs: ${online_task.n_envs}
  # residue progress
  res_scale: 0.15
  prog_explore: 50000
  bootstrap_at_done: truncated  # never, always, truncated
  # training loop control in steps
  num_steps: 500000
  buffer_size: 500000
  log_every: 1000
  eval_every: 10000
  checkpoint_every: 100000
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: metaworld_online_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}