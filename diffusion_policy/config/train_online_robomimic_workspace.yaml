defaults:
  - _self_
  - online_task: can_image_abs

name: train_online_robomimic_workspace
_target_: diffusion_policy.workspace.train_online_robomimic_workspace.TrainOnlineRobomimicWorkspace

task_name: ${online_task.name}
shape_meta: ${online_task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0

base_policy:
  _target_: diffusion_policy.policy.flow_match_unet_image_policy.FlowMatchUnetImagePolicy

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_flow_match_euler_discrete.FlowMatchEulerDiscreteScheduler
    num_train_timesteps: 100

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: [76, 76]
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 2
  obs_as_global_cond: True
  diffusion_step_embed_dim: 128
  down_dims: [128,256,512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

res_policy:
  _target_: diffusion_policy.policy.residue_policy.ResiduePolicy
  obs_dim: ???
  action_dim: ???
  log_std_max: 1.6
  log_std_min: -10.0
  actor_input: obs
  gamma: 0.97
  tau: 0.01
  init_alpha: 0.01
  auto_alpha: True
  res_scale: ${training.res_scale}

training:
  device: "cuda:0"
  seed: 42
  debug: False
  # optimization
  batch_size: 512
  policy_lr: 1e-4
  q_lr: 1e-4
  learning_start: 1000
  # lr_scheduler: cosine
  # lr_warmup_steps: 100
  max_grad_norm: 50.0
  policy_freq: 1
  target_freq: 1
  training_freq: 100
  utd: 0.25
  n_envs: ${online_task.n_envs}
  # residue progress
  res_scale: 0.1
  prog_explore: 50000
  bootstrap_at_done: never  # never, always, truncated
  # training loop control in steps
  num_steps: 1000000
  buffer_size: 1000000
  log_every: 500
  eval_every: 50000
  checkpoint_every: 100000
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: online_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}