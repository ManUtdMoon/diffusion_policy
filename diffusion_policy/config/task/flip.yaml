name: flip

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    image:
      shape: [3, 128, 128]
      type: rgb
    qpos:
      shape: [7]
      type: low_dim
  action: 
    shape: [6]

task_name: &task_name flip
dataset_path: &dataset_path /data/hdd2/dongjie/flip/flip.h5

mode: rel  # "rel", "abs"

dataset:
  _target_: diffusion_policy.dataset.flip_dataset.FlipDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  use_cache: True
  seed: 0
  val_ratio: 0.01
  num_demo: 100
  mode: ${task.mode}
  quantile: '0.999'
