name: wallet

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    global:
      shape: [3, 120, 160]
      type: rgb
    wrist_0:
      shape: [3, 120, 160]
      type: rgb
    wrist_1:
      shape: [3, 120, 160]
      type: rgb
    qpos:
      shape: [16]
      type: low_dim
  action: 
    shape: [16]

task_name: &task_name wallet
dataset_path: /media/datahub-2/ydj/real/wallet/wallet.h5

dataset:
  _target_: diffusion_policy.dataset.wallet_dataset.WalletDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  use_cache: True
  seed: 0
  val_ratio: 0.02
  num_demo: 50
  # Per-sample image aug; torchvision ColorJitter samples one set of
  # params per call, so all T frames of a sample get the same shift.
  # Auto-disabled on the validation set via get_validation_dataset().
  # Set to null to disable entirely.
  rgb_aug:
    _target_: torchvision.transforms.v2.ColorJitter
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.02
