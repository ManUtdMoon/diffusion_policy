name: adroit_hammer
task_name: hammer

shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    agent_pos:
      shape: [24]
      type: low_dim
  action:
    shape: [26]

base_ckpt: "data/outputs/2025.12.12/16.13.12_train_flow_match_vib_unet_image_adroit_hammer/checkpoints/latest.ckpt"

# train
n_envs: 20

# eval
env_runner:
  _target_: diffusion_policy.env_runner.adroit_runner.AdroitRunner
  eval_episodes: 100
  max_steps: 200
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  task_name: hammer
  tqdm_interval_sec: 1.0
  n_envs: 25
  test_start_seed: 10000
  render_device_id: ${eval:'int("${training.device}"[-1])'}