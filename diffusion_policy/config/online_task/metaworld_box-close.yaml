name: box-close

task_name: box-close

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    agent_pos:
      shape: [9]
      type: low_dim
  action:
    shape: [4]

base_ckpt: "data/outputs/2025.12.17/18.26.35_train_flow_match_vib_unet_image_box-close/checkpoints/latest.ckpt"

# train
n_envs: 20

success_threshold: 0.5

env_runner:
  _target_: diffusion_policy.env_runner.metaworld_runner.MetaworldRunner
  eval_episodes: 100
  max_steps: 200
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  task_name: ${task_name}
  tqdm_interval_sec: 1.0
  n_envs: 25
  render_device_id: ${eval:'int("${training.device}".split(":")[-1])'}
